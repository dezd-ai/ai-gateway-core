name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core (build / vet / test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 最低支持版本（go.mod 声明）+ 最新稳定版，确保上下限兼容
        go-version: ['1.23.11', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l . | grep -v '^obs/obs$' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

  obs:
    name: obs (build / vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: obs/go.mod
      - name: Build obs
        run: cd obs && go build ./...
      - name: Vet obs
        run: cd obs && go vet ./...
