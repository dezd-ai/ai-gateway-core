name: 功能建议
description: 提出一个新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么场景/痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或接口设计（可附伪代码/配置示例）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - kernel（内核/路由/代理）
        - 新插件
        - 新路由策略
        - 非标协议适配
        - config / 配置格式
        - obs（观测台）
        - docs
        - 其他
  - type: checkboxes
    id: willingness
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
